<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tristinwold</title>
<style>
  :root { --ink: #e8dcc4; --dim: #a89a80; --gold: #d8b25a; --blood: #c0503c; --ice: #8fb8d8; --bg: rgba(18, 14, 10, 0.94); --line: rgba(216, 178, 90, 0.35); }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.45 Georgia, "Times New Roman", serif; color: var(--ink); background: transparent; }
  #panel { position: fixed; inset: 6vh 8vw; background: var(--bg); border: 1px solid var(--line); display: flex; flex-direction: column; }
  header { display: flex; align-items: baseline; gap: 16px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 24px; letter-spacing: 0.08em; color: var(--gold); font-weight: normal; }
  #status { color: var(--dim); font-size: 14px; flex: 1; }
  button { font: inherit; color: var(--ink); background: rgba(216, 178, 90, 0.12); border: 1px solid var(--line); padding: 4px 12px; cursor: pointer; }
  button:hover { background: rgba(216, 178, 90, 0.28); }
  nav { display: flex; gap: 4px; padding: 8px 20px 0; border-bottom: 1px solid var(--line); }
  nav button { border-bottom: none; }
  nav button.on { background: rgba(216, 178, 90, 0.35); color: #fff; }
  main { flex: 1; overflow: auto; padding: 16px 20px; }
  .row { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid rgba(216,178,90,0.12); }
  .row .grow { flex: 1; }
  .dim { color: var(--dim); font-size: 14px; }
  .done { color: var(--dim); text-decoration: line-through; }
  .rank { color: var(--gold); text-transform: uppercase; font-size: 13px; letter-spacing: 0.1em; }
  .dead { color: var(--blood); }
  .tag { display: inline-block; border: 1px solid var(--line); padding: 0 6px; margin: 2px 4px 0 0; font-size: 13px; }
  textarea, input[type=text] { width: 100%; font: inherit; color: var(--ink); background: rgba(0,0,0,0.4); border: 1px solid var(--line); padding: 6px; }
  .key { color: var(--ice); }
  #log p { margin: 4px 0; }
</style>
</head>
<body>
<div id="panel">
  <header><h1>TRISTINWOLD</h1><span id="status"></span><button onclick="send({ tw: 'close' })">Close (F10)</button></header>
  <nav id="tabs"></nav>
  <main id="body"></main>
</div>
<script>
  // The plugin pushes the whole state with tw.render(state); buttons go back as sendMessage.
  var tabs = ["Board", "Companies", "Nemeses", "Dead drops", "Chronicle"];
  var tab = "Board";
  var state = null;
  function send(msg) { if (window.skyrimPlatform) window.skyrimPlatform.sendMessage(msg); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function company() { return state ? state.status.split(" | ")[0] : ""; }

  var views = {
    "Board": function () {
      return state.contracts.map(function (c) {
        var mine = c.claimedBy === company();
        var act = c.status === "Open" ? '<button onclick="send({tw:\'claim\',id:\'' + esc(c.id) + '\'})">Take it</button>'
          : c.status === "Claimed" && mine ? '<button onclick="send({tw:\'finish\',id:\'' + esc(c.id) + '\'})">Done</button> <button onclick="send({tw:\'abandon\',id:\'' + esc(c.id) + '\'})">Abandon</button>'
          : c.status === "Claimed" ? '<span class="dim">' + esc(c.claimedBy) + "'s</span>" : '<span class="dim">Done</span>';
        return '<div class="row"><div class="grow"><div class="' + (c.status === "Done" ? "done" : "") + '">' + esc(c.title) + '</div>' +
          '<div class="dim">' + esc(c.postedBy) + (c.where ? " &middot; " + esc(c.where) : "") + " &middot; " + c.pay + ' gp</div></div>' + act + '</div>';
      }).join("") || '<p class="dim">The board is empty.</p>';
    },
    "Companies": function () {
      var keys = state.keystones.map(function (k) { return '<p class="key">' + esc(k) + "</p>"; }).join("");
      return keys + state.groups.map(function (g) {
        return '<div class="row"><div class="grow"><div>' + esc(g.player) + "'s company " + (g.online ? "" : '<span class="dim">(resting)</span>') + '</div>' +
          '<div class="dim">' + (g.online ? esc(g.area || "somewhere in the city") : "") + " &middot; " + esc(g.party.join(", ")) + "</div></div></div>";
      }).join("");
    },
    "Nemeses": function () {
      var order = { Overlord: 0, Warchief: 1, Captain: 2, Grunt: 3 };
      return state.nemeses.slice().sort(function (a, b) { return (b.alive - a.alive) || (order[a.rank] - order[b.rank]); }).map(function (n) {
        return '<div class="row"><div class="grow"><div><span class="rank">' + esc(n.rank) + "</span> " + esc(n.name) +
          (n.alive ? "" : ' <span class="dead">(fallen)</span>') + '</div><div class="dim">' + esc(n.species) + ", level " + n.level + (n.home ? " &middot; " + esc(n.home) : "") + "</div>" +
          '<div>' + n.traits.map(function (t) { return '<span class="tag">' + esc(t) + "</span>"; }).join("") + "</div>" +
          n.scars.map(function (s) { return '<div class="dim">Scar: ' + esc(s) + "</div>"; }).join("") +
          n.grudges.map(function (s) { return '<div class="dim">' + esc(s) + "</div>"; }).join("") +
          n.history.map(function (h) { return '<div class="dim">' + esc(h) + "</div>"; }).join("") + "</div></div>";
      }).join("") || '<p class="dim">No nemesis knows your name. Yet.</p>';
    },
    "Dead drops": function () {
      var notes = (state.drops[state.here] || []).map(function (d) { return '<p>Day ' + d.day + ", from " + esc(d.from) + ": " + esc(d.text) + "</p>"; }).join("");
      return '<p>You are in <b>' + esc(state.here) + "</b>.</p>" + (notes || '<p class="dim">No notes hidden here reached you.</p>') +
        '<p>Leave a note here for the next company:</p><textarea id="drop" rows="3" maxlength="600"></textarea>' +
        '<p><button onclick="var t=document.getElementById(\'drop\');send({tw:\'drop\',text:t.value});t.value=\'\'">Hide the note</button>' +
        ' <span class="dim">Some notes never arrive. Someone is reading them.</span></p>';
    },
    "Chronicle": function () {
      return '<div id="log">' + state.log.map(function (l) { return "<p>" + esc(l) + "</p>"; }).join("") + "</div>" +
        '<p><input id="say" type="text" maxlength="400" placeholder="Say something to every company" onkeydown="if(event.key===\'Enter\'){send({tw:\'say\',text:this.value});this.value=\'\'}"></p>';
    },
  };

  function draw() {
    document.getElementById("tabs").innerHTML = tabs.map(function (t) {
      return '<button class="' + (t === tab ? "on" : "") + '" onclick="tab=\'' + t + '\';draw()">' + t + "</button>";
    }).join("");
    if (!state) return;
    document.getElementById("status").textContent = state.status;
    var focus = document.activeElement && document.activeElement.id;
    var typed = focus ? document.getElementById(focus).value : null;
    document.getElementById("body").innerHTML = views[tab]();
    if (focus && document.getElementById(focus)) { document.getElementById(focus).value = typed; document.getElementById(focus).focus(); }
  }

  window.tw = { render: function (s) { state = s; draw(); } };
  document.addEventListener("keydown", function (e) { if (e.key === "F10" || e.key === "Escape") send({ tw: "close" }); });
  draw();
  send({ tw: "ready" });
</script>
</body>
</html>
